<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <style>
        :root {
            --bg: #eef3f8;
            --card: #ffffff;
            --text: #172033;
            --muted: #667085;
            --border: #d9e2ec;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --danger: #ef4444;
            --shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
            --soft-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: "Inter", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(37, 99, 235, 0.12), transparent 32%),
                linear-gradient(135deg, #f8fbff 0%, var(--bg) 100%);
            color: var(--text);
        }

        #container {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 360px;
            gap: 18px;
            width: 100vw;
            height: 100vh;
            padding: 18px;
        }

        #map-card {
            position: relative;
            overflow: hidden;
            border-radius: 26px;
            background: linear-gradient(180deg, #ffffff 0%, #f7faff 100%);
            border: 1px solid rgba(217, 226, 236, 0.9);
            box-shadow: var(--shadow);
        }

        #map-header {
            position: absolute;
            top: 18px;
            left: 18px;
            z-index: 5;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(217, 226, 236, 0.95);
            border-radius: 18px;
            padding: 14px 16px;
            box-shadow: var(--soft-shadow);
            max-width: 390px;
        }

        #map-header h1 {
            margin: 0 0 4px 0;
            font-size: 19px;
            letter-spacing: -0.02em;
        }

        #map-header p {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.35;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        #info-panel {
            height: calc(100vh - 36px);
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(217, 226, 236, 0.95);
            border-radius: 26px;
            box-shadow: var(--shadow);
            padding: 20px;
            overflow-y: auto;
        }

        .panel-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        #info-panel h2 {
            margin: 0;
            font-size: 24px;
            letter-spacing: -0.03em;
            color: var(--text);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            padding: 6px 10px;
            background: #eff6ff;
            color: var(--primary-dark);
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        #info-panel p {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
            margin: 0 0 16px 0;
        }

        .total-card {
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 50%, #60a5fa 100%);
            color: white;
            box-shadow: 0 14px 28px rgba(37, 99, 235, 0.25);
        }

        .total-card .label {
            font-size: 12px;
            opacity: 0.85;
            margin-bottom: 6px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .total-card .value {
            font-size: 23px;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            padding: 13px 14px;
            border: 1px solid #edf2f7;
            border-radius: 16px;
            background: #fbfdff;
            font-size: 14px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .stat-row:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 16px rgba(15, 23, 42, 0.06);
        }

        .stat-label {
            color: var(--muted);
            font-weight: 700;
        }

        .stat-value {
            color: var(--text);
            text-align: right;
            font-weight: 800;
        }

        .empty-state {
            display: grid;
            place-items: center;
            min-height: 280px;
            text-align: center;
            border: 1px dashed #cbd5e1;
            border-radius: 22px;
            padding: 24px;
            background: #fbfdff;
        }

        .empty-state .icon {
            width: 54px;
            height: 54px;
            display: grid;
            place-items: center;
            border-radius: 18px;
            background: #eff6ff;
            color: var(--primary);
            font-size: 26px;
            margin: 0 auto 12px auto;
        }

        .municipio {
            cursor: pointer;
            stroke: rgba(255, 255, 255, 0.9);
            stroke-width: 0.45px;
            transition: opacity 0.2s ease, filter 0.2s ease, stroke-width 0.2s ease;
        }

        .municipio:hover {
            opacity: 0.9;
            stroke: #0f172a;
            stroke-width: 1.2px;
            filter: drop-shadow(0px 2px 3px rgba(15, 23, 42, 0.25));
        }

        .municipio.selected {
            stroke: #111827;
            stroke-width: 1.8px;
            filter: drop-shadow(0px 4px 6px rgba(15, 23, 42, 0.32));
        }

        .tooltip {
            position: absolute;
            padding: 12px 14px;
            background: rgba(15, 23, 42, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 14px;
            pointer-events: none;
            font-size: 13px;
            box-shadow: 0 14px 32px rgba(15, 23, 42, 0.24);
            color: white;
            z-index: 1000;
            line-height: 1.45;
            min-width: 190px;
        }

        .tooltip strong {
            display: block;
            font-size: 15px;
            margin-bottom: 4px;
        }

        #legend {
            position: absolute;
            left: 18px;
            bottom: 18px;
            z-index: 5;
            width: 260px;
            border-radius: 18px;
            padding: 13px 14px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(217, 226, 236, 0.95);
            box-shadow: var(--soft-shadow);
        }

        #legend-title {
            font-size: 12px;
            color: var(--muted);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        #legend-gradient {
            height: 11px;
            border-radius: 999px;
            background: linear-gradient(90deg, #dbeafe, #93c5fd, #3b82f6, #1d4ed8, #172554);
            margin-bottom: 7px;
        }

        #legend-values {
            display: flex;
            justify-content: space-between;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
        }

        @media (max-width: 900px) {
            body {
                overflow: auto;
            }

            #container {
                grid-template-columns: 1fr;
                height: auto;
                min-height: 100vh;
            }

            #map-card {
                height: 70vh;
            }

            #info-panel {
                height: auto;
                min-height: 360px;
            }

            #map-header {
                max-width: calc(100% - 36px);
            }
        }
    </style>
</head>

<body>
    <div id="container">
        <div id="map-card">
            <div id="map-header">
                <h1>Mapa Interativo do Ceará</h1>
                <p>Clique em um município para ver o resumo estatístico dos contratos.</p>
            </div>

            <div id="map"></div>

            <div id="legend">
                <div id="legend-title">Total contratado</div>
                <div id="legend-gradient"></div>
                <div id="legend-values">
                    <span>Menor</span>
                    <span>Maior</span>
                </div>
            </div>
        </div>

        <div id="info-panel">
            <div class="empty-state">
                <div>
                    <div class="icon">📍</div>
                    <h2>Informações</h2>
                    <p>Clique em um município no mapa para visualizar o <strong>describe()</strong> dos contratos.</p>
                </div>
            </div>
        </div>
    </div>

    <div id="tooltip" class="tooltip" style="display: none;"></div>

    <script>
        const dataFromStreamlit = {};
        const describeFromStreamlit = {};
        const geojson = {};

        let selectedMunicipio = null;

        function formatCurrency(value) {
            const number = Number(value || 0);
            return number.toLocaleString('pt-BR', {
                style: 'currency',
                currency: 'BRL',
                maximumFractionDigits: 2
            });
        }

        function formatNumber(value) {
            const number = Number(value || 0);
            return number.toLocaleString('pt-BR', {
                maximumFractionDigits: 2
            });
        }

        function updateInfoPanel(nomeMunicipio) {
            const panel = d3.select("#info-panel");
            const info = describeFromStreamlit[nomeMunicipio];
            const total = dataFromStreamlit[nomeMunicipio] || 0;

            if (!info) {
                panel.html(`
                    <div class="panel-title">
                        <h2>${nomeMunicipio}</h2>
                        <span class="badge">Sem dados</span>
                    </div>

                    <p>Não há dados de contratos para este município.</p>

                    <div class="total-card">
                        <div class="label">Total contratado</div>
                        <div class="value">${formatCurrency(total)}</div>
                    </div>
                `);
                return;
            }

            panel.html(`
                <div class="panel-title">
                    <h2>${nomeMunicipio}</h2>
                    <span class="badge">${formatNumber(info.count)} contratos</span>
                </div>

                <p>Resumo estatístico de <strong>valorGlobal</strong> para os contratos deste município.</p>

                <div class="total-card">
                    <div class="label">Total contratado</div>
                    <div class="value">${formatCurrency(total)}</div>
                </div>

                <div class="stats-grid">
                    <div class="stat-row">
                        <span class="stat-label">Quantidade</span>
                        <span class="stat-value">${formatNumber(info.count)}</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Média</span>
                        <span class="stat-value">${formatCurrency(info.mean)}</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Desvio padrão</span>
                        <span class="stat-value">${formatCurrency(info.std)}</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Mínimo</span>
                        <span class="stat-value">${formatCurrency(info.min)}</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">25%</span>
                        <span class="stat-value">${formatCurrency(info["25%"])}</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Mediana</span>
                        <span class="stat-value">${formatCurrency(info["50%"])}</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">75%</span>
                        <span class="stat-value">${formatCurrency(info["75%"])}</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Máximo</span>
                        <span class="stat-value">${formatCurrency(info.max)}</span>
                    </div>
                </div>
            `);
        }

        const renderChart = () => {
            const width = 975;
            const height = 680;
            const tooltip = d3.select("#tooltip");

            const zoom = d3.zoom()
                .scaleExtent([1, 8])
                .on("zoom", zoomed);

            const svg = d3.create("svg")
                .attr("viewBox", [0, 0, width, height])
                .attr("width", "100%")
                .attr("height", "100%")
                .attr("preserveAspectRatio", "xMidYMid meet")
                .style("background", "transparent")
                .on("click", reset);

            const projection = d3.geoMercator().fitSize([width, height], geojson);
            const path = d3.geoPath().projection(projection);

            const values = Object.values(dataFromStreamlit).map(Number).filter(v => !isNaN(v));
            const maxValue = d3.max(values) || 10;

            const colorScale = d3.scaleSequential()
                .interpolator(d3.interpolateRgbBasis(["#dbeafe", "#93c5fd", "#3b82f6", "#1d4ed8", "#172554"]))
                .domain([0, maxValue]);

            const g = svg.append("g");

            g.append("path")
                .datum(geojson)
                .attr("fill", "#eaf1f8")
                .attr("stroke", "none")
                .attr("d", path);

            const municipios = g.append("g")
                .selectAll("path")
                .data(geojson.features)
                .join("path")
                .attr("class", "municipio")
                .attr("fill", d => {
                    const val = Number(dataFromStreamlit[d.properties.name] || 0);
                    return val > 0 ? colorScale(val) : "#d7dee8";
                })
                .attr("d", path)
                .on("click", clicked)
                .on("mouseover", function(event, d) {
                    const nome = d.properties.name;
                    const val = dataFromStreamlit[nome] || 0;
                    const info = describeFromStreamlit[nome];

                    tooltip.style("display", "block")
                        .html(`
                            <strong>${nome}</strong>
                            Total: ${formatCurrency(val)}<br/>
                            ${info ? `Contratos: ${formatNumber(info.count)}` : 'Sem dados'}
                        `);

                    d3.select(this).raise();
                })
                .on("mousemove", function(event) {
                    tooltip
                        .style("top", (event.pageY + 16) + "px")
                        .style("left", (event.pageX + 16) + "px");
                })
                .on("mouseleave", function() {
                    tooltip.style("display", "none");
                });

            g.append("path")
                .datum(geojson)
                .attr("fill", "none")
                .attr("stroke", "rgba(255,255,255,0.95)")
                .attr("stroke-width", 0.75)
                .attr("stroke-linejoin", "round")
                .attr("d", path)
                .style("pointer-events", "none");

            svg.call(zoom);

            function reset() {
                selectedMunicipio = null;

                municipios
                    .classed("selected", false)
                    .transition()
                    .duration(450)
                    .attr("fill", d => {
                        const val = Number(dataFromStreamlit[d.properties.name] || 0);
                        return val > 0 ? colorScale(val) : "#d7dee8";
                    });

                svg.transition().duration(650).call(
                    zoom.transform,
                    d3.zoomIdentity,
                    d3.zoomTransform(svg.node()).invert([width / 2, height / 2])
                );
            }

            function clicked(event, d) {
                const [[x0, y0], [x1, y1]] = path.bounds(d);
                const nome = d.properties.name;
                event.stopPropagation();

                selectedMunicipio = nome;
                updateInfoPanel(nome);

                municipios
                    .classed("selected", item => item.properties.name === nome)
                    .transition()
                    .duration(280)
                    .attr("fill", item => {
                        if (item.properties.name === nome) return "#f97316";

                        const val = Number(dataFromStreamlit[item.properties.name] || 0);
                        return val > 0 ? colorScale(val) : "#d7dee8";
                    });

                d3.select(this).raise();

                svg.transition().duration(700).call(
                    zoom.transform,
                    d3.zoomIdentity
                        .translate(width / 2, height / 2)
                        .scale(Math.min(7, 0.88 / Math.max((x1 - x0) / width, (y1 - y0) / height)))
                        .translate(-(x0 + x1) / 2, -(y0 + y1) / 2),
                    d3.pointer(event, svg.node())
                );
            }

            function zoomed(event) {
                const { transform } = event;
                g.attr("transform", transform);
                g.attr("stroke-width", 0.75 / transform.k);
            }

            return svg.node();
        };

        document.getElementById("map").appendChild(renderChart());
    </script>
</body>
</html>
